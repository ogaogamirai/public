<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌌 3D Commons Universal Viewer</title>
  
  <!-- Fonts & Math -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Three.js & OrbitControls & Tween -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <style>
    :root {
      --bg-canvas: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(226, 232, 240, 0.85);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --accent-blue: #0284c7;
      --accent-blue-hover: #0369a1;
      --accent-pink: #e11d48;
      --accent-amber: #d97706;
      --accent-emerald: #059669;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI Overlay Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      gap: 16px;
    }

    /* Header Info Card */
    .header-card {
      pointer-events: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 20px;
      max-width: 460px;
      box-shadow: var(--shadow-md);
      transition: all 0.25s ease;
    }

    .category-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .header-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .formula-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background: rgba(2, 132, 199, 0.06);
      border: 1px solid rgba(2, 132, 199, 0.2);
      border-radius: 10px;
      font-size: 0.92rem;
      color: #0369a1;
      overflow-x: auto;
      max-width: 100%;
    }

    /* Top Actions (Right) */
    .top-actions {
      position: absolute;
      top: 24px;
      right: 24px;
      pointer-events: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .action-btn:hover {
      background: #ffffff;
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      transform: translateY(-1px);
    }

    /* Controls Panel (Bottom Left) */
    .controls-card {
      pointer-events: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-self: flex-start;
      max-width: 440px;
      box-shadow: var(--shadow-md);
    }

    .btn-group-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-light);
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .view-btn {
      background: rgba(241, 245, 249, 0.85);
      border: 1px solid rgba(203, 213, 225, 0.8);
      color: var(--text-main);
      padding: 7px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .view-btn:hover {
      background: #ffffff;
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .view-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-hover));
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    /* Sliders */
    .sliders-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.82rem;
    }
    .slider-label {
      color: var(--text-muted);
      font-weight: 500;
      flex: 1;
    }
    .slider-val {
      font-weight: 700;
      color: var(--accent-blue);
      min-width: 36px;
      text-align: right;
    }
    .slider-input {
      flex: 1.4;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    /* Axis / Legend (Bottom Right) */
    .axis-legend {
      position: absolute;
      bottom: 24px;
      right: 24px;
      pointer-events: auto;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-md);
    }

    .axis-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .axis-row strong {
      color: var(--text-main);
    }

    .axis-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Floating Hint */
    .floating-hint {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-light);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-sm);
      pointer-events: none;
    }

    /* Compact Embed Mode */
    body.embed-mode .ui-layer { padding: 12px; }
    body.embed-mode .header-card { max-width: 280px; padding: 10px 14px; border-radius: 14px; }
    body.embed-mode .header-title { font-size: 0.95rem; }
    body.embed-mode .header-desc { display: none; }
    body.embed-mode .controls-card { padding: 10px 14px; border-radius: 14px; max-width: 320px; }
    body.embed-mode .axis-legend { padding: 8px 12px; bottom: 12px; right: 12px; border-radius: 12px; }
    body.embed-mode .top-actions { top: 12px; right: 12px; }

    .btn-short { display: none; }

    /* Mobile: compact chrome, keep the lesson description */
    @media (max-width: 768px) {
      .ui-layer {
        padding: max(6px, env(safe-area-inset-top)) 8px max(6px, env(safe-area-inset-bottom));
        justify-content: space-between;
        gap: 6px;
      }

      .floating-hint { display: none; }
      .category-badge { display: none; }

      .header-card {
        max-width: calc(100% - 56px);
        padding: 8px 10px;
        border-radius: 12px;
      }
      .header-title {
        font-size: 0.88rem;
        margin-bottom: 4px;
      }
      .header-desc {
        display: block;
        font-size: 0.72rem;
        line-height: 1.45;
        -webkit-line-clamp: unset;
        overflow: visible;
      }
      .formula-badge {
        font-size: 0.75rem;
        padding: 2px 8px;
        margin-top: 4px;
        border-radius: 8px;
      }

      .top-actions {
        top: max(6px, env(safe-area-inset-top));
        right: 8px;
        flex-direction: column;
        gap: 4px;
      }
      .action-btn {
        padding: 5px 8px;
        border-radius: 8px;
        font-size: 0.7rem;
      }
      .btn-full { display: none; }
      .btn-short { display: inline; }

      .controls-card {
        max-width: 100%;
        width: 100%;
        padding: 8px 10px;
        border-radius: 12px;
        gap: 6px;
      }
      .btn-group-title { display: none; }
      .btn-group {
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
        gap: 4px;
      }
      .view-btn {
        flex-shrink: 0;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 0.7rem;
      }
      .slider-row {
        gap: 6px;
        font-size: 0.7rem;
      }
      .slider-label { flex: 0 1 auto; max-width: 42%; }
      .slider-val { min-width: 28px; }
      .slider-input { height: 22px; }

      .axis-legend { display: none !important; }
    }
    @media (max-width: 768px) and (orientation: portrait) {
      .controls-card { padding: 6px 8px; gap: 4px; }
    }

    /* Error Overlay */
    .error-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      border: 1px solid #fca5a5;
      padding: 24px;
      border-radius: 18px;
      color: #991b1b;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--shadow-md);
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-layer">
    <!-- Header Card -->
    <div class="header-card" id="header-card">
      <div class="category-badge" id="model-category">Loading...</div>
      <div class="header-title" id="model-title">3D Commons</div>
      <div class="header-desc" id="model-desc"></div>
      <div class="formula-badge" id="model-formula" style="display:none;"></div>
    </div>

    <div class="floating-hint">🖱️ マウス・指で自由回転 / ピンチ・ホイールでズーム</div>

    <!-- Top Actions -->
    <div class="top-actions">
      <button class="action-btn" id="btn-pause" onclick="togglePlayPause()"><span class="btn-full">⏸️ 一時停止</span><span class="btn-short">停止</span></button>
      <button class="action-btn" id="btn-catalog" onclick="location.href='index.html'"><span class="btn-full">📚 カタログ</span><span class="btn-short">一覧</span></button>
    </div>

    <!-- Controls Panel -->
    <div class="controls-card" id="controls-card">
      <div id="views-container">
        <div class="btn-group-title">🎯 視点切り替え</div>
        <div class="btn-group" id="views-group"></div>
      </div>
      <div id="sliders-container" style="display:none;">
        <div class="btn-group-title">🎛️ パラメータ調整</div>
        <div class="sliders-group" id="sliders-group"></div>
      </div>
    </div>

    <!-- Legend (Desktop) -->
    <div class="axis-legend" id="axis-legend" style="display:none;"></div>
  </div>

  <div class="error-card" id="error-card">
    <h3>⚠️ モデルの読み込みエラー</h3>
    <p id="error-msg" style="margin-top: 8px; font-size: 0.85rem; color: #b91c1c;"></p>
    <button class="action-btn" style="margin: 16px auto 0;" onclick="location.href='viewer.html?model=euler-spiral'">オイラーの螺旋を開く</button>
  </div>

  <script type="module">
    // Determine Model ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const modelId = urlParams.get('model') || 'euler-spiral';
    const isEmbed = urlParams.get('embed') === 'true';
    if (isEmbed) document.body.classList.add('embed-mode');

    // Three.js Scene Core (Bright, Elegant Setup)
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xf8fafc, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setClearColor(0xf8fafc, 1.0);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Elegant Natural Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff7ed, 1.6);
    keyLight.position.set(25, 35, 25);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xe0f2fe, 1.0);
    fillLight.position.set(-25, -15, -25);
    scene.add(fillLight);

    // Global State
    let currentModel = null;
    const modelState = {
      params: {},
      isPaused: false,
      isReady: false
    };

    // Load Model Module Dynamically with Cache Buster
    async function loadModel(id) {
      try {
        const cacheBuster = Date.now();
        const modulePath = `./models/${id}.js?v=${cacheBuster}`;
        const module = await import(modulePath);
        currentModel = module.default;
        initModelUI(currentModel);
        
        // Initialize Model Three.js Scene
        if (currentModel.parameters) {
          for (const [k, p] of Object.entries(currentModel.parameters)) {
            modelState.params[k] = p.value;
          }
        }
        currentModel.init(THREE, scene, modelState);
        modelState.isReady = true;

        // Set Initial Camera
        if (currentModel.views) {
          const defaultKey = Object.keys(currentModel.views).find(k => currentModel.views[k].default) || Object.keys(currentModel.views)[0];
          const v = currentModel.views[defaultKey];
          camera.position.set(...v.pos);
          controls.target.set(...v.target);
        }
      } catch (err) {
        console.error("Failed to load model:", err);
        document.getElementById("error-card").style.display = "block";
        document.getElementById("error-msg").textContent = `モデル "${id}" の読み込みに失敗しました: ${err.message}`;
      }
    }

    // Math text parser helper for inline $...$
    function renderMathText(text) {
      if (!text) return "";
      if (!window.katex) return text;
      return text.replace(/\$([^\$]+)\$/g, (match, math) => {
        try {
          return katex.renderToString(math, { displayMode: false, throwOnError: false });
        } catch (e) {
          return match;
        }
      });
    }

    // Build UI Controls from Model Metadata
    function initModelUI(m) {
      document.getElementById("model-category").textContent = m.categoryLabel || "3D COMMONS";
      document.getElementById("model-title").textContent = m.title || m.id;
      document.getElementById("model-desc").innerHTML = renderMathText(m.description || "");

      // KaTeX Formula
      const formulaEl = document.getElementById("model-formula");
      if (m.formula && window.katex) {
        formulaEl.style.display = "inline-block";
        try {
          katex.render(m.formula, formulaEl, { displayMode: false, throwOnError: false });
        } catch(e) {
          formulaEl.textContent = m.formula;
        }
      }

      // Views Buttons
      const viewsGroup = document.getElementById("views-group");
      viewsGroup.innerHTML = "";
      if (m.views) {
        Object.entries(m.views).forEach(([key, v], idx) => {
          const btn = document.createElement("button");
          btn.className = `view-btn ${v.default || idx === 0 ? 'active' : ''}`;
          btn.textContent = v.name || key;
          btn.onclick = () => switchView(v, btn);
          viewsGroup.appendChild(btn);
        });
      }

      // Sliders
      const slidersContainer = document.getElementById("sliders-container");
      const slidersGroup = document.getElementById("sliders-group");
      slidersGroup.innerHTML = "";
      if (m.parameters && Object.keys(m.parameters).length > 0) {
        slidersContainer.style.display = "block";
        Object.entries(m.parameters).forEach(([key, p]) => {
          const row = document.createElement("div");
          row.className = "slider-row";

          const label = document.createElement("span");
          label.className = "slider-label";
          label.innerHTML = renderMathText(p.label || key);

          const input = document.createElement("input");
          input.type = "range";
          input.className = "slider-input";
          input.min = p.min;
          input.max = p.max;
          input.step = p.step || 1;
          input.value = p.value;

          const valSpan = document.createElement("span");
          valSpan.className = "slider-val";
          valSpan.textContent = p.value;

          input.oninput = (e) => {
            const val = parseFloat(e.target.value);
            valSpan.textContent = val;
            modelState.params[key] = val;
            if (currentModel.onParamChange) {
              currentModel.onParamChange(THREE, modelState, key, val);
            }
          };

          row.appendChild(label);
          row.appendChild(input);
          row.appendChild(valSpan);
          slidersGroup.appendChild(row);
        });
      }

      // Legend (Desktop)
      const legendEl = document.getElementById("axis-legend");
      legendEl.innerHTML = "";
      if (m.legend && m.legend.length > 0) {
        legendEl.style.display = "flex";
        m.legend.forEach(item => {
          const row = document.createElement("div");
          row.className = "axis-row";
          row.innerHTML = `<span class="axis-dot" style="background: ${item.color};"></span> <span>${renderMathText(item.label)}</span>`;
          legendEl.appendChild(row);
        });
      }
    }

    // Switch View Function
    window.switchView = function(viewConfig, btn) {
      document.querySelectorAll('#views-group .view-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (window.TWEEN) {
        new TWEEN.Tween(camera.position)
          .to({ x: viewConfig.pos[0], y: viewConfig.pos[1], z: viewConfig.pos[2] }, 1000)
          .easing(TWEEN.Easing.Cubic.InOut)
          .start();

        new TWEEN.Tween(controls.target)
          .to({ x: viewConfig.target[0], y: viewConfig.target[1], z: viewConfig.target[2] }, 1000)
          .easing(TWEEN.Easing.Cubic.InOut)
          .start();
      } else {
        camera.position.set(...viewConfig.pos);
        controls.target.set(...viewConfig.target);
      }
    };

    // Play / Pause
    window.togglePlayPause = function() {
      modelState.isPaused = !modelState.isPaused;
      const btn = document.getElementById("btn-pause");
      btn.innerHTML = modelState.isPaused
        ? '<span class="btn-full">▶️ 再生</span><span class="btn-short">再生</span>'
        : '<span class="btn-full">⏸️ 一時停止</span><span class="btn-short">停止</span>';
    };

    // Animation Loop
    let lastTime = 0;
    function animate(time) {
      requestAnimationFrame(animate);
      const dt = lastTime === 0 ? 0.016 : Math.min((time - lastTime) / 1000, 0.1);
      lastTime = time;

      if (window.TWEEN) TWEEN.update(time);
      controls.update();

      if (currentModel && currentModel.update && modelState.isReady && !modelState.isPaused) {
        currentModel.update(THREE, modelState, dt, time / 1000);
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start loading
    loadModel(modelId);
  </script>
</body>
</html>
